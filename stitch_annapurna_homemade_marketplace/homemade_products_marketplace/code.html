    image: "https://lh3.googleusercontent.com/aida-public/AB6AXuC5Xti1ZMpxFyfEU7bOob9aokGMzWNxFOvcWbnB3ZV21Ttx2EIA-hZeh4cRiKMA8pwC_pokkXfCLy83wi2FXcX_yKpM8D4x7G1gzoL-hCaPmOrDIbZJUGtQWbFWbf4oveaPCvS_3qqvVOYFx4YPSN8osyElLZWgP_nzjzmCLvR9foHGhOWdTErf6oK6q0Tarl96NmxiwzuPbM5Q0_1V061kk5hVT59wuazK0zBuLB-LHd5ZNelY4KMlLQ"
  }
];

// Active Filter State
let activeCategory = "All";
// ==========================================
// RENDERING & FILTERING FUNCTIONS
// ==========================================

function renderProducts() {
  const searchInput = document.getElementById("searchInput");
  const query = searchInput ? searchInput.value.toLowerCase().trim() : "";

  const productsGrid = document.getElementById("productsGrid");
  const noProductsMessage = document.getElementById("noProductsMessage");

  if (!productsGrid) return;

  // Filter logic: category match AND search match
  let filtered = [];
  try {
      filtered = productsData.filter(product => {
        const matchesCategory = (activeCategory === "All") || (product.category === activeCategory);
        const matchesSearch = !query || 
          (product.name && product.name.toLowerCase().includes(query)) || 
          (product.seller && product.seller.toLowerCase().includes(query)) ||
          (product.category && product.category.toLowerCase().includes(query));
        return matchesCategory && matchesSearch;
      });
  } catch(e) {
      alert("Error filtering: " + e.message);
  }

  if (filtered.length === 0) {
    productsGrid.innerHTML = "";
    if (noProductsMessage) noProductsMessage.classList.remove("hidden");
    return;
  } else {
    if (noProductsMessage) noProductsMessage.classList.add("hidden");
  }

  productsGrid.innerHTML = filtered.map(product => `
    <div class="bg-surface-container-lowest rounded-lg shadow-organic border border-outline-variant flex flex-col overflow-hidden justify-between">
      <div class="aspect-square bg-surface-container-high relative overflow-hidden">
        <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover" />
      </div>
      <div class="p-2 flex flex-col flex-1 gap-1 justify-between">
        <div>
          <h3 class="font-label-sm font-semibold text-on-surface leading-tight line-clamp-2">${product.name}</h3>
          <p class="text-[10px] text-on-surface-variant truncate">${product.seller}</p>
          <div class="flex items-center gap-0.5 mt-0.5">
            <span class="material-symbols-outlined text-[12px] text-primary" style="font-variation-settings: 'FILL' 1;">star</span>
            <span class="text-[10px] text-on-surface-variant">${product.rating} (${product.reviewsCount})</span>
          </div>
        </div>
        <div>
          <div class="flex items-end justify-between mt-auto pt-1">
            <div>
              <span class="block text-[9px] text-on-surface-variant">${product.weight}</span>
              <span class="font-label-sm font-bold text-on-surface leading-none">₹${product.price}</span>
            </div>
          </div>
          <button onclick="addToCart('${product.id}')" class="mt-2 bg-primary text-on-primary w-full py-1.5 rounded-full text-[10px] font-bold flex items-center justify-center gap-1 active:scale-95 transition-transform hover:bg-primary-container">
            Add <span class="material-symbols-outlined text-[12px]">shopping_cart</span>
          </button>
        </div>
      </div>
    </div>
  `).join('');
}

function selectCategory(category, targetBtn) {
  activeCategory = category;

  // Update chip button active styling
  const chipBtns = document.querySelectorAll(".chip-btn");
  chipBtns.forEach(btn => {
    if (btn.getAttribute("data-category") === category) {
      btn.className = "chip-btn snap-start shrink-0 px-4 py-1.5 rounded-full bg-primary text-on-primary font-label-md transition-colors whitespace-nowrap cursor-pointer";
    } else {
      btn.className = "chip-btn snap-start shrink-0 px-4 py-1.5 rounded-full bg-transparent border border-outline text-on-surface-variant font-label-md hover:bg-surface-container-low transition-colors whitespace-nowrap cursor-pointer";
    }
  });

  renderProducts();
}

// ==========================================
// CART & NOTIFICATION LOGIC
// ==========================================

function addToCart(productId) {
  const product = productsData.find(p => p.id === productId);
  if (!product) return;

  if (typeof AnnapurnaCart !== 'undefined') {
      AnnapurnaCart.addItem({ ...product, quantity: 1, type: 'product' });
  }

  showToast(`Added "${product.name}" to cart!`);
}

function showToast(message) {
  const toast = document.getElementById("toastNotification");
  const toastMessage = document.getElementById("toastMessage");
  if (!toast || !toastMessage) return;

  toastMessage.textContent = message;
  toast.classList.remove("hidden");
  toast.classList.add("animate-toast");

  setTimeout(() => {
    toast.classList.add("hidden");
    toast.classList.remove("animate-toast");
  }, 2500);
}

// ==========================================
// DOM INITIALIZATION
// ==========================================

document.addEventListener("DOMContentLoaded", () => {
  // Initial Render
  renderProducts();

  // Search input listener
  const searchInput = document.getElementById("searchInput");
  if (searchInput) {
    searchInput.addEventListener("input", renderProducts);
  }

  // Category chips listeners
  const chipBtns = document.querySelectorAll(".chip-btn");
  chipBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      const cat = btn.getAttribute("data-category");
      selectCategory(cat, btn);
    });
  });

  // Reset filter button
  const resetProductsFilterBtn = document.getElementById("resetProductsFilterBtn");
  if (resetProductsFilterBtn) {
    resetProductsFilterBtn.addEventListener("click", () => {
      if (searchInput) searchInput.value = "";
      const allChip = document.querySelector('.chip-btn[data-category="All"]');
      selectCategory("All", allChip);
    });
  }

  // Back button
  const backBtn = document.getElementById("backBtn");
  if (backBtn) {
    backBtn.addEventListener("click", () => {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "../annapurna_home_screen/code.html";
      }
    });
  }
});
</script>
</body></html>
