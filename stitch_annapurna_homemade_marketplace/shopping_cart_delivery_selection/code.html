<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
    <script src="../cart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col pb-24 md:pb-0">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-background dark:bg-background z-40">
<div class="flex justify-between items-center px-margin-mobile py-base w-full max-w-7xl mx-auto">
<button onclick="window.history.length > 1 ? window.history.back() : window.location.href='../annapurna_home_screen/code.html'" class="p-2 -ml-2 text-primary dark:text-inverse-primary hover:bg-surface-container dark:hover:bg-surface-container transition-colors rounded-full active:scale-95 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary dark:text-inverse-primary tracking-tight">Your Cart</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</div>
</header>
<main class="flex-grow w-full max-w-3xl mx-auto px-margin-mobile py-md flex flex-col gap-lg">
<!-- Cart Items List -->
<section id="cartItemsContainer" class="flex flex-col gap-sm">
<!-- Summary Bar -->
<div class="mt-md bg-surface-container-low rounded-xl p-md flex justify-between items-center shadow-[0_4px_16px_rgba(51,48,42,0.05)]">
<span class="font-label-md text-label-md text-on-background">Total Amount</span>
<span id="totalAmountDisplay" class="font-headline-md text-headline-md text-primary-container">₹0</span>
</div>
</section>
<!-- Delivery / Pickup Option -->
<section class="flex flex-col gap-sm">
<h2 class="font-label-md text-label-md text-on-background">Delivery / Pickup</h2>
<div class="flex items-center gap-md p-sm bg-surface-container-lowest rounded-xl border border-surface-variant">
<label class="flex items-center gap-sm cursor-pointer flex-1">
<input checked="" class="w-5 h-5 text-secondary bg-surface border-outline focus:ring-secondary focus:ring-2" name="delivery_type" type="radio"/>
<span class="font-body-md text-body-md text-on-background">Pickup</span>
</label>
<div class="w-px h-8 bg-surface-variant"></div>
<label class="flex items-center gap-sm cursor-pointer flex-1">
<input class="w-5 h-5 text-secondary bg-surface border-outline focus:ring-secondary focus:ring-2" name="delivery_type" type="radio"/>
<span class="font-body-md text-body-md text-on-background">Delivery</span>
</label>
</div>
</section>
<!-- Address Section -->
<section class="flex flex-col gap-sm">
<h2 class="font-label-md text-label-md text-on-background">Delivery Address</h2>
<div class="bg-surface-container-low rounded-xl p-md flex flex-col gap-sm shadow-[0_4px_16px_rgba(51,48,42,0.05)] relative overflow-hidden">
<div class="flex justify-between items-start">
<div class="bg-secondary-container text-on-secondary-container font-label-sm text-label-sm px-3 py-1 rounded-full inline-flex items-center gap-1 w-fit">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">home</span>
                        Home
                    </div>
<button onclick="const newAddr = prompt('Enter new delivery address:', document.getElementById('deliveryAddressText').textContent.trim()); if(newAddr) { document.getElementById('deliveryAddressText').textContent = newAddr; }" class="font-label-sm text-label-sm text-secondary hover:text-on-secondary-container transition-colors">Change</button>
</div>
<p id="deliveryAddressText" class="font-body-md text-body-md text-on-surface-variant mt-xs">
                    FC Road, Shivajinagar, Pune - 411005
                 </p>
</div>
</section>
</main>
<!-- Sticky Checkout Button (Mobile Only, or fixed on bottom for cart) -->
<div class="fixed bottom-0 left-0 w-full z-50 bg-background/80 backdrop-blur-md p-margin-mobile md:static md:bg-transparent md:backdrop-blur-none md:p-0 md:mt-lg md:max-w-3xl md:mx-auto">
<button id="proceedCheckoutBtn" class="w-full bg-secondary text-on-secondary hover:bg-on-secondary-container active:scale-95 transition-all rounded-full py-4 px-6 flex items-center justify-between shadow-[0_8px_24px_rgba(27,109,36,0.2)]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">shopping_cart_checkout</span>
<span class="font-label-md text-label-md absolute left-1/2 -translate-x-1/2">Proceed to Checkout</span>
<span id="checkoutTotalDisplay" class="font-label-md text-label-md font-bold">₹0</span>
</button>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const container = document.getElementById('cartItemsContainer');
    const totalDisplay = document.getElementById('totalAmountDisplay');
    const checkoutTotalDisplay = document.getElementById('checkoutTotalDisplay');
    const checkoutBtn = document.getElementById('proceedCheckoutBtn');

    function renderCart() {
        if (!container) return;
        const items = AnnapurnaCart.getItems();
        
        // Find Summary Bar to keep it at the bottom
        const summaryBar = `
            <div class="mt-md bg-surface-container-low rounded-xl p-md flex justify-between items-center shadow-[0_4px_16px_rgba(51,48,42,0.05)]">
                <span class="font-label-md text-label-md text-on-background">Total Amount</span>
                <span id="totalAmountDisplay" class="font-headline-md text-headline-md text-primary-container">₹${AnnapurnaCart.getTotal()}</span>
            </div>`;

        if (items.length === 0) {
            container.innerHTML = '<p class="text-on-surface-variant text-center py-md">Your cart is empty.</p>' + summaryBar;
        } else {
            const html = items.map(item => {
                const itemPrice = parseFloat(String(item.price).replace(/[^0-9.]/g, '')) || 0;
                const totalItemPrice = itemPrice * (item.quantity || 1);
                const itemNameEscaped = item.name.replace(/'/g, "\'");
                
                return `
                <div class="flex items-center gap-md py-sm border-b border-surface-variant">
                    <img class="w-20 h-20 object-cover rounded-lg bg-surface-container-high flex-shrink-0" src="${item.image || 'https://via.placeholder.com/80'}"/>
                    <div class="flex-grow flex flex-col gap-xs">
                        <span class="font-label-md text-label-md text-on-background">${item.name}</span>
                        <span class="font-body-md text-body-md text-on-surface-variant">₹${itemPrice} × ${item.quantity || 1}</span>
                    </div>
                    <div class="flex flex-col items-end gap-sm">
                        <span class="font-label-md text-label-md text-primary-container">₹${totalItemPrice}</span>
                        <div class="flex items-center gap-xs bg-surface-container rounded-full px-2 py-1">
                            <button onclick="AnnapurnaCart.updateQuantity('${item.id}', -1); renderCart();" class="p-1 rounded-full text-on-surface-variant hover:bg-surface-variant transition-colors"><span class="material-symbols-outlined text-sm">remove</span></button>
                                <span class="font-label-sm text-label-sm w-4 text-center">${item.quantity || 1}</span>
                            <button onclick="AnnapurnaCart.updateQuantity('${item.id}', 1); renderCart();" class="p-1 rounded-full text-primary-container hover:bg-primary-fixed transition-colors"><span class="material-symbols-outlined text-sm">add</span></button>
                        </div>
                    </div>
                </div>`;
            }).join('');
            
            container.innerHTML = html + summaryBar;
        }
        
        const total = AnnapurnaCart.getTotal();
        if (checkoutTotalDisplay) checkoutTotalDisplay.textContent = '₹' + total;
        
        // Disable checkout if empty
        if (checkoutBtn) {
            checkoutBtn.disabled = items.length === 0;
            if (items.length === 0) checkoutBtn.classList.add('opacity-50', 'cursor-not-allowed');
            else checkoutBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }
    }

    window.addEventListener('cartUpdated', renderCart);
    renderCart();

    if (checkoutBtn) {
        checkoutBtn.addEventListener('click', () => {
            const items = AnnapurnaCart.getItems();
            if (items.length > 0) {
                window.location.href = '../checkout_address_delivery_selection/code.html';
            }
        });
    }
});
</script>
</body></html>
