<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Annapurna - Pre-Ordered Food System</title>
<link rel="stylesheet" href="../assets/styles.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&amp;family=DM+Sans:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-family: 'Material Symbols Outlined';
            font-size: 24px;
            line-height: 1;
            display: inline-block;
            text-transform: none;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
    body {
        background-color: #FDF6EC; /* Warm cream */
        overflow-x: hidden;
    }
    .food-corner {
        position: absolute;
        width: 250px;
        height: 250px;
        border-radius: 50%;
        object-fit: cover;
        opacity: 0.85;
        box-shadow: 0 16px 32px rgba(89, 66, 56, 0.1);
    }
    .doodle {
        position: absolute;
        opacity: 0.1;
        pointer-events: none;
        z-index: -1;
    }
    /* Simple wave bottom */
    .wave-bottom {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: auto;
        min-height: 20vh;
        background-color: #9f3d00; /* Primary */
        border-top-left-radius: 50% 30%;
        border-top-right-radius: 50% 30%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-top: 3rem;
        padding-bottom: max(2rem, env(safe-area-inset-bottom));
        flex-shrink: 0;
    }
</style>
</head>
<body class="relative min-h-screen w-full flex flex-col justify-between font-body-md text-on-background overflow-x-hidden">
<!-- Status Bar (Mock) -->
<div aria-hidden="true" class="absolute top-0 w-full flex justify-between items-center px-6 py-3 z-50 text-on-surface-variant font-label-md">
<span>9:41</span>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">wifi</span>
<span class="material-symbols-outlined text-[18px]">battery_full</span>
</div>
</div>
<!-- Background Doodles -->
<span aria-hidden="true" class="material-symbols-outlined doodle text-8xl text-outline top-10 -left-6 -rotate-12">restaurant_menu</span>
<span aria-hidden="true" class="material-symbols-outlined doodle text-6xl text-outline top-32 right-10 rotate-12">local_pizza</span>
<span aria-hidden="true" class="material-symbols-outlined doodle text-7xl text-outline bottom-[30%] left-[20%] rotate-90">local_dining</span>
<span aria-hidden="true" class="material-symbols-outlined doodle text-6xl text-outline bottom-[40%] right-[10%] -rotate-45">skillet</span>
<!-- Food Photo Corners -->
<!-- Top Right -->
<img alt="Curry Bowl" class="food-corner -top-16 -right-16 md:-top-10 md:-right-10 z-0" src="../assets/images/curry_bowl.jpg" onerror="this.onerror=null;this.src='';this.style.background='#e8e2d8';"/>
<!-- Bottom Left -->
<img alt="Thali" class="food-corner bottom-20 -left-20 md:bottom-32 md:-left-10 z-0" src="../assets/images/thali.jpg" onerror="this.onerror=null;this.src='';this.style.background='#e8e2d8';"/>
<!-- Bottom Right -->
<img alt="Rice Bowl" class="food-corner bottom-40 -right-24 md:bottom-48 md:-right-16 z-0" src="../assets/images/rice_bowl.jpg" onerror="this.onerror=null;this.src='';this.style.background='#e8e2d8';"/>
<!-- Center Content -->
<div class="relative z-10 flex flex-col items-center text-center px-margin-mobile flex-grow justify-center mt-[15vh] w-full max-w-md mx-auto">
<!-- Logo -->
<img alt="Annapurna Logo" class="w-32 h-32 md:w-40 md:h-40 object-contain mb-md drop-shadow-sm" src="../assets/images/logo.png" onerror="this.onerror=null;this.src='../assets/images/logo.svg';this.style.padding='8px';"/>
<!-- Wordmark -->
<h1 class="font-headline-xl text-primary mb-xs tracking-tight">Annapurna</h1>
<!-- Tagline -->
<div class="flex items-center gap-2 mb-sm text-secondary font-label-md uppercase tracking-wider">
<span>Pre-Ordered Food System</span>
</div>
<!-- Sub-tagline -->
<p class="font-body-md text-on-surface-variant max-w-[250px]">
            Empowering Home Kitchens
        </p>
</div>
<!-- Bottom Wave & Button -->
<div class="wave-bottom z-20 relative w-full">
<button onclick="window.location.href='../choose_your_role/code.html'" class="bg-surface text-primary font-label-md py-[14px] px-xl rounded-full shadow-[0_8px_24px_rgba(89,66,56,0.15)] hover:bg-surface-container-highest transition-colors active:scale-95 cursor-pointer">
            Get Started
</button>
</div>
</body></html>
