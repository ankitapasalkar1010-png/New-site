<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: max(884px, 100dvh);
        }
        h1, h2, h3, h4, h5, h6, .font-headline-md {

            animation: spin 1s linear infinite;

<body class="bg-background text-on-background min-h-screen flex flex-col relative pb-32">
<!-- Confirmation Modal / Toast -->
<div id="orderSuccessModal" class="fixed inset-0 z-50 hidden bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-surface rounded-2xl p-6 max-w-sm w-full flex flex-col items-center text-center gap-4 shadow-2xl border border-surface-container-highest">
        <div class="w-16 h-16 rounded-full bg-secondary-container/40 flex items-center justify-center text-secondary">
            <span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
        </div>
        <h3 class="font-headline-md text-headline-md text-on-surface">Order Confirmed!</h3>
        <p id="modalMsg" class="font-body-md text-sm text-on-surface-variant">Your order has been placed successfully.</p>
        <button id="modalHomeBtn" class="w-full bg-primary text-on-primary font-label-md py-3 rounded-full font-bold hover:bg-primary/90 transition-colors">
            Back to Home
        </button>
    </div>
</div>

<!-- TopAppBar -->
<div class="sticky top-0 z-40 bg-background flex items-center justify-between px-margin-mobile w-full h-16" role="banner">
<button id="backBtn" aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors text-on-surface-variant cursor-pointer">
<span class="material-symbols-outlined" data-icon="chevron_left" style="font-variation-settings: 'FILL' 0;">chevron_left</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold absolute left-1/2 -translate-x-1/2">Checkout</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</div>
<!-- Main Content Canvas -->
<main class="flex-grow px-margin-mobile pt-md flex flex-col gap-lg max-w-md mx-auto w-full">
<!-- Payment Method Section -->
<section class="flex flex-col gap-sm">
<h2 class="font-headline-md text-headline-md text-on-background">Payment Method</h2>
<div class="flex flex-col gap-base">
<!-- UPI -->
<label id="label-upi" class="flex items-center p-4 rounded-[24px] border-2 border-secondary bg-surface-container-low cursor-pointer transition-all hover:bg-surface-container-highest">
<div id="iconbox-upi" class="w-12 h-12 rounded-full bg-secondary/10 flex items-center justify-center mr-4 text-secondary">
<span class="material-symbols-outlined" data-icon="account_balance">account_balance</span>
</div>
<div class="flex-grow">
<span id="title-upi" class="font-body-lg text-body-lg text-on-background font-medium">UPI</span>
</div>
<div class="ml-4 flex items-center justify-center">
<input checked="" class="w-6 h-6 text-secondary border-secondary focus:ring-secondary cursor-pointer" name="payment_method" type="radio" value="upi"/>
</div>
</label>

<!-- Cash on Delivery -->
<label id="label-cod" class="flex items-center p-4 rounded-[24px] border-2 border-surface-variant bg-surface-container-lowest cursor-pointer transition-all hover:bg-surface-container-low">
<div id="iconbox-cod" class="w-12 h-12 rounded-full bg-on-surface-variant/10 flex items-center justify-center mr-4 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
</div>
<div class="flex-grow">
<span id="title-cod" class="font-body-lg text-body-lg text-on-background">Cash on Delivery</span>
</div>
<div class="ml-4 flex items-center justify-center">
<input class="w-6 h-6 text-secondary border-surface-variant focus:ring-secondary cursor-pointer" name="payment_method" type="radio" value="cod"/>
</div>
</label>

<!-- Card / Net Banking -->
<label id="label-card" class="flex items-center p-4 rounded-[24px] border-2 border-surface-variant bg-surface-container-lowest cursor-pointer transition-all hover:bg-surface-container-low">
<div id="iconbox-card" class="w-12 h-12 rounded-full bg-on-surface-variant/10 flex items-center justify-center mr-4 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="credit_card">credit_card</span>
</div>
<div class="flex-grow">
<span id="title-card" class="font-body-lg text-body-lg text-on-background">Card / Net Banking</span>
</div>
<div class="ml-4 flex items-center justify-center">
<input class="w-6 h-6 text-secondary border-surface-variant focus:ring-secondary cursor-pointer" name="payment_method" type="radio" value="card"/>
</div>
</label>

<!-- Wallet -->
<label id="label-wallet" class="flex items-center p-4 rounded-[24px] border-2 border-surface-variant bg-surface-container-lowest cursor-pointer transition-all hover:bg-surface-container-low">
<div id="iconbox-wallet" class="w-12 h-12 rounded-full bg-on-surface-variant/10 flex items-center justify-center mr-4 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="account_balance_wallet">account_balance_wallet</span>
</div>
<div class="flex-grow">
<span id="title-wallet" class="font-body-lg text-body-lg text-on-background">Wallet</span>
</div>
<div class="ml-4 flex items-center justify-center">
<input class="w-6 h-6 text-secondary border-surface-variant focus:ring-secondary cursor-pointer" name="payment_method" type="radio" value="wallet"/>
</div>
</label>
</div>
</section>

<!-- Order Summary Section -->
<section class="flex flex-col gap-sm">
<h2 class="font-headline-md text-headline-md text-on-background">Order Summary</h2>
<div class="bg-surface-container-lowest rounded-[24px] p-md flex flex-col gap-base shadow-[0_4px_24px_0_rgba(54,15,0,0.05)] border border-surface-variant">
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">Items Total</span>
<span id="summaryItemsTotal" class="font-body-md text-body-md text-on-background font-medium">₹540</span>
</div>
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">Delivery Fee</span>
<span id="summaryDeliveryFee" class="font-body-md text-body-md text-primary font-medium">FREE</span>
</div>
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">Packaging Charges</span>
<span id="summaryPackaging" class="font-body-md text-body-md text-on-background font-medium">₹60</span>
</div>
<hr class="border-t border-surface-variant my-2"/>
<div class="flex justify-between items-center mt-2">
<span class="font-headline-md text-headline-md text-on-background font-bold">Total Amount</span>
<span id="summaryTotalAmount" class="font-headline-md text-headline-md text-secondary font-bold">₹600</span>
</div>
</div>
</section>
</main>

<!-- Fixed Bottom Action -->
<div class="fixed bottom-0 w-full bg-background/90 backdrop-blur-md px-margin-mobile py-4 pb-safe border-t border-surface-variant/50 z-40">
<button id="confirmOrderBtn" class="w-full max-w-md mx-auto bg-secondary hover:bg-secondary/90 text-on-secondary font-headline-md text-headline-md py-4 px-8 rounded-full transition-colors flex justify-center items-center font-bold shadow-md cursor-pointer">
      Confirm Order
</button>
</div>

<script>
// ==========================================
// DATA CONSISTENCY & ORDER TOTALS
// ==========================================

// Read stored order total from previous step or default to 600
let orderTotal = parseInt(sessionStorage.getItem("annapurna_order_total")) || 600;

function updateOrderSummary() {
  const summaryTotalAmount = document.getElementById("summaryTotalAmount");
  const summaryItemsTotal = document.getElementById("summaryItemsTotal");
  
  if (summaryTotalAmount) summaryTotalAmount.textContent = `₹${orderTotal}`;
  if (summaryItemsTotal) summaryItemsTotal.textContent = `₹${Math.max(0, orderTotal - 60)}`;
}

// ==========================================
// PAYMENT METHOD SELECTION LOGIC
// ==========================================

const paymentMethods = [
  { id: "upi", name: "UPI" },
  { id: "cod", name: "Cash on Delivery" },
  { id: "card", name: "Card / Net Banking" },
  { id: "wallet", name: "Wallet" }
];

function updatePaymentSelectionUI() {
  const selectedRadio = document.querySelector('input[name="payment_method"]:checked');
  const selectedValue = selectedRadio ? selectedRadio.value : "upi";

  paymentMethods.forEach(method => {
    const label = document.getElementById(`label-${method.id}`);
    const iconbox = document.getElementById(`iconbox-${method.id}`);
    const title = document.getElementById(`title-${method.id}`);

    if (method.id === selectedValue) {
      // Selected Style
      if (label) label.className = "flex items-center p-4 rounded-[24px] border-2 border-secondary bg-surface-container-low cursor-pointer transition-all hover:bg-surface-container-highest";
      if (iconbox) iconbox.className = "w-12 h-12 rounded-full bg-secondary/10 flex items-center justify-center mr-4 text-secondary";
      if (title) title.className = "font-body-lg text-body-lg text-on-background font-medium";
    } else {
      // Unselected Style
      if (label) label.className = "flex items-center p-4 rounded-[24px] border-2 border-surface-variant bg-surface-container-lowest cursor-pointer transition-all hover:bg-surface-container-low";
      if (iconbox) iconbox.className = "w-12 h-12 rounded-full bg-on-surface-variant/10 flex items-center justify-center mr-4 text-on-surface-variant";
      if (title) title.className = "font-body-lg text-body-lg text-on-background";
    }
  });
}

// ==========================================
// DOM INITIALIZATION & EVENT LISTENERS
// ==========================================

document.addEventListener("DOMContentLoaded", () => {
  // Sync Order Summary
  updateOrderSummary();

  // Attach change event listeners to radio inputs
  const radios = document.querySelectorAll('input[name="payment_method"]');
  radios.forEach(radio => {
    radio.addEventListener("change", updatePaymentSelectionUI);
  });
  updatePaymentSelectionUI();

  // Back button navigation
  const backBtn = document.getElementById("backBtn");
  if (backBtn) {
    backBtn.addEventListener("click", () => {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "../checkout_address_delivery_selection/code.html";
      }
    });
  }

  // Confirm Order Button logic
  const confirmOrderBtn = document.getElementById("confirmOrderBtn");
  const modal = document.getElementById("orderSuccessModal");
  const modalMsg = document.getElementById("modalMsg");
  const modalHomeBtn = document.getElementById("modalHomeBtn");

  if (confirmOrderBtn) {
    confirmOrderBtn.addEventListener("click", () => {
      const selectedRadio = document.querySelector('input[name="payment_method"]:checked');
      const methodVal = selectedRadio ? selectedRadio.value : "upi";
      const methodObj = paymentMethods.find(m => m.id === methodVal);
      const methodName = methodObj ? methodObj.name : "UPI";

      console.log("Confirming Order:", {
        paymentMethod: methodName,
        totalAmount: orderTotal
      });

      // Show loading state
      confirmOrderBtn.disabled = true;
      confirmOrderBtn.innerHTML = `
        <span class="material-symbols-outlined animate-spin mr-2">progress_activity</span> Processing Order...
      `;

      // Simulate order processing delay
      setTimeout(() => {
        confirmOrderBtn.disabled = false;
        confirmOrderBtn.textContent = "Confirm Order";

        // Show confirmation modal
        if (modal && modalMsg) {
          modalMsg.textContent = `Payment Method: ${methodName} • Amount Paid: ₹${orderTotal}`;
          modal.classList.remove("hidden");
        }
      }, 1200);
    });
  }

  if (modalHomeBtn) {
    modalHomeBtn.addEventListener("click", () => {
      window.location.href = "../annapurna_home_screen/code.html";
    });
  }
});
</script>
</body></html>
